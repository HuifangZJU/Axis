site_name: AXIS
site_description: Virtual tissue generation and spatially matched analysis from spatial omics
site_url: https://huifangzju.github.io/Axis/
repo_url: https://github.com/HuifangZJU/Axis
repo_name: HuifangZJU/Axis
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 The AXIS authors &middot; MIT License

# Broken links, missing pages and unknown anchors are warnings, which
# `mkdocs build --strict` (CI) turns into errors.
validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - content.code.copy
    - content.action.edit
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: deep orange
      toggle: {icon: material/weather-night, name: Dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: deep orange
      toggle: {icon: material/weather-sunny, name: Light mode}
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: numpy
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            members_order: source
            separate_signature: true
            show_signature_annotations: false
            filters: ["!^_"]
            heading_level: 2

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc: {permalink: true}
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight: {anchor_linenums: true}
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.arithmatex: {generic: true}
  - pymdownx.tabbed: {alternate_style: true}

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - Installation: installation.md
  - Quickstart: quickstart.md
  - Tutorials:
      - tutorials/index.md
      - Transition fields: tutorials/transition_fields.md
      - Virtual tissue generation: tutorials/generation.md
      - Spatially matched analysis: tutorials/matching.md
      - Population-level integration: tutorials/population.md
      - Cross-modality analysis: tutorials/cross_modality.md
      - Your own data: tutorials/custom_data.md
  - Gallery: gallery.md
  - API reference:
      - api/index.md
      - axis.pp: api/pp.md
      - axis.tl: api/tl.md
      - axis.pl: api/pl.md
      - axis.metrics: api/metrics.md
      - axis.registration: api/registration.md
      - axis.generation: api/generation.md
      - axis.matching: api/matching.md
      - Settings, configs & I/O: api/settings.md
  - Method: method.md
  - Reproducibility: reproducibility.md
  - Changelog: changelog.md
  - Citation: citation.md
