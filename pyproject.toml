[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "axis-spatial"
dynamic = ["version"]
description = "AXIS: virtual tissue generation and spatially matched analysis from spatial omics"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    { name = "Huifang Ma" },
    { name = "Haotian Zhuang" },
    { name = "Wenpin Hou" },
    { name = "Anru Zhang" },
    { name = "Zhicheng Ji", email = "zhicheng.ji@duke.edu" },
]
keywords = [
    "spatial omics",
    "spatial transcriptomics",
    "virtual tissue",
    "image registration",
    "deep learning",
    "anndata",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "numpy>=1.23",
    "scipy>=1.9",
    "pandas>=1.5",
    "anndata>=0.9",
    "scanpy>=1.9",
    "scikit-learn>=1.1",
    "torch>=2.0",
    "torchvision>=0.15",
    "einops>=0.6",
    "matplotlib>=3.6",
    "opencv-python-headless>=4.7",
    "pillow>=9.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
metrics = ["alphashape>=1.3", "shapely>=2.0", "scikit-image>=0.20"]
crossmodal = ["xgboost>=1.7"]
train = ["tensorboardX>=2.6", "imgaug>=0.4"]
paper = [
    "axis-spatial[metrics,crossmodal,train]",
    "seaborn>=0.12",
    "h5py>=3.8",
    "pyreadr>=0.4",
    "statsmodels>=0.14",
    "patsy>=0.5",
    "paste-bio>=1.4",
    "POT>=0.9",
    "igraph>=0.10",
    "leidenalg>=0.9",
]
docs = [
    "mkdocs>=1.5",
    "mkdocs-material>=9.4",
    "mkdocstrings[python]>=0.24",
    "pymdown-extensions>=10.0",
]
dev = ["pytest>=7", "pytest-cov>=4", "ruff>=0.5", "build>=1.0", "twine>=5"]

[project.urls]
Homepage = "https://github.com/HuifangZJU/Axis"
Documentation = "https://huifangzju.github.io/Axis/"
Source = "https://github.com/HuifangZJU/Axis"
Issues = "https://github.com/HuifangZJU/Axis/issues"

[tool.setuptools.dynamic]
version = { attr = "axis._version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::FutureWarning",
]

[tool.ruff]
line-length = 130
target-version = "py310"
extend-exclude = ["reproducibility"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "E741", "B905", "B006", "B008", "UP006", "UP035", "UP007", "UP045"]

[tool.ruff.lint.per-file-ignores]
"src/axis/__init__.py" = ["F401"]
"src/axis/*/__init__.py" = ["F401"]
"src/axis/metrics/monitor.py" = ["B007"]
